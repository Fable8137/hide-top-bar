<div class="hide-top-bar-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>Hide Top Bar</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <label class="checkbox_label" for="hide_top_bar_checkbox">
                <input id="hide_top_bar_checkbox" type="checkbox" />
                <span>Hide the top bar</span>
            </label>
            <label class="checkbox_label" for="hide_top_bar_floating_checkbox">
                <input id="hide_top_bar_floating_checkbox" type="checkbox" />
                <span>Show floating button</span>
            </label>
            <div>
                <label for="hide_top_bar_size_slider">Button size: <span id="hide_top_bar_size_value">32px</span></label>
                <input id="hide_top_bar_size_slider" type="range" min="20" max="64" step="2" value="32" />
            </div>
            <div>
                <input id="hide_top_bar_reset_btn" class="menu_button" type="submit" value="Reset button position" />
            </div>
            <div>
                <input id="hide_top_bar_reset_size_btn" class="menu_button" type="submit" value="Reset button size" />
            </div>
            <div>
                <span>Shortcut: <b id="hide_top_bar_shortcut_label">Alt+H</b></span>
            </div>
            <div>
                <input id="hide_top_bar_shortcut_btn" class="menu_button" type="submit" value="Change shortcut" />
            </div>
            <div>
                <input id="hide_top_bar_shortcut_reset_btn" class="menu_button" type="submit" value="Reset shortcut" />
            </div>
            <p><small>Click "Change shortcut", then press the new combination (it must include Ctrl, Alt or Meta). Esc cancels.</small></p>
        </div>
    </div>
</div>
